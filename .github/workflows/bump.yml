name: Bump Version

on:
  workflow_dispatch:
    inputs:
      version:
        description: "New version (e.g. 0.1.5) without leading v"
        required: true
        type: string
      dry_run:
        description: "Only update files; skip commit/tag/push"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  bump:
    name: Bump version to ${{ inputs.version }}
    runs-on: ubuntu-latest
    steps:
      - name: Validate version
        run: |
          if [[ ! "${{ inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Version '${{ inputs.version }}' is not valid semver (X.Y.Z[-pre])." >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fail if tag already exists
        run: |
          if git rev-parse "refs/tags/v${{ inputs.version }}" >/dev/null 2>&1; then
            echo "Tag v${{ inputs.version }} already exists." >&2
            exit 1
          fi

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Update Cargo.toml
        env:
          NEW_VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'PY'
          import os, re, pathlib
          v = os.environ["NEW_VERSION"]
          p = pathlib.Path("Cargo.toml")
          text = p.read_text()
          new_text, n = re.subn(
              r'(?m)^version\s*=\s*"[^"]+"',
              f'version = "{v}"',
              text,
              count=1,
          )
          if n != 1:
              raise SystemExit("Failed to find `version = \"...\"` in Cargo.toml")
          p.write_text(new_text)
          print(f"Cargo.toml -> {v}")
          PY

      - name: Update Cargo.lock
        run: cargo update -p nova-veil-search

      - name: Warn if CHANGELOG missing entry
        env:
          NEW_VERSION: ${{ inputs.version }}
        run: |
          if ! grep -qE "^## ${NEW_VERSION}( |$)" CHANGELOG.md; then
            echo "::warning::CHANGELOG.md has no section for ${NEW_VERSION}. Add it before publishing."
          fi

      - name: Show diff
        run: git --no-pager diff --stat

      - name: Commit, tag and push
        if: inputs.dry_run != true
        env:
          NEW_VERSION: ${{ inputs.version }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          if git diff --cached --quiet; then
            echo "No changes to commit (already at v${NEW_VERSION})." >&2
            exit 1
          fi
          git commit -m "Release nova-veil-search ${NEW_VERSION}"
          git tag -a "v${NEW_VERSION}" -m "v${NEW_VERSION}"
          git push origin HEAD:${GITHUB_REF_NAME}
          git push origin "v${NEW_VERSION}"
