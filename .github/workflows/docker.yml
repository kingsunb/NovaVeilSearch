name: Docker

# Continuous image build/push for the main branch, reusing the same
# "pre-built musl binary + Dockerfile.deploy" approach as release.yml so arm64
# never needs an in-container compile (QEMU builds would OOM/timeout on small
# CI runners). Pushes on every push to main and on manual dispatch; PRs build
# only (no login, no push) to validate the Dockerfile/dist layout.
#
# Tags produced: <image>:latest, <image>:main and <image>:sha-<short>.
# `:<semver>` stays owned by release.yml (tag push v*).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # Lowercased explicitly: GHCR image names are case-sensitive and must be
  # lowercase, so do not use github.repository here (it keeps the repo case).
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/nova-veil-search

jobs:
  build-binaries:
    name: Build http binary (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            artifact_name: binary-linux-amd64
            cross: false
          - target: aarch64-unknown-linux-musl
            artifact_name: binary-linux-arm64
            cross: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install cross
        if: matrix.cross == true
        uses: taiki-e/install-action@cross

      - name: Build http binary
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --profile release-http --features http --target ${{ matrix.target }} --locked
          else
            cargo build --profile release-http --features http --target ${{ matrix.target }} --locked
          fi

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: target/${{ matrix.target }}/release-http/nova-veil-search

  publish:
    name: Build & push multi-arch image
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download http binaries
        uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: http-artifacts

      # Dockerfile.deploy COPYs dist/${TARGETPLATFORM}/nova-veil-search; its
      # Dockerfile.deploy.dockerignore keeps the build context to dist/ alone.
      - name: Lay out dist/ for Dockerfile.deploy
        run: |
          mkdir -p dist/linux/amd64 dist/linux/arm64
          install -m 0755 http-artifacts/binary-linux-amd64/nova-veil-search dist/linux/amd64/nova-veil-search
          install -m 0755 http-artifacts/binary-linux-arm64/nova-veil-search dist/linux/arm64/nova-veil-search
          ls -lR dist

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=ref,event=branch
            type=sha,format=short,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.deploy
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}